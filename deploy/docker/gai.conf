# Hardybot currently receives IPv6 DNS answers without a working IPv6 route.
# Preserve the glibc default precedence table while preferring IPv4-mapped
# destinations so bounded Google API calls do not stall on unreachable IPv6.
precedence ::1/128       50
precedence ::/0          40
precedence 2002::/16     30
precedence ::/96         20
precedence ::ffff:0:0/96 100
