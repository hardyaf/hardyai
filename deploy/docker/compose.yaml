    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3));
          raise SystemExit(0 if payload.get('status') == 'ok' else 1)
