      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/run/jarvis-documents/enqueue.sock').is_socket() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  document-gateway:
    image: jarvis-poc-app:local
    profiles: ["documents"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      paperless-webserver:
        condition: service_healthy
      document-worker:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      OFFLINE_MODE: "true"
      DOCUMENTS_ENABLED: "true"
      DOCUMENTS_LOCAL_ONLY: "true"
      DOCUMENTS_DATABASE_PATH: /opt/jarvis/documents/documents.db
      DOCUMENTS_SPOOL_PATH: /opt/jarvis/documents/spool
      DOCUMENTS_MIN_FREE_BYTES: "${DOCUMENTS_MIN_FREE_BYTES:-1073741824}"
      DOCUMENTS_MAX_IMAGE_PIXELS: "${DOCUMENTS_MAX_IMAGE_PIXELS:-64000000}"
      DOCUMENT_JOB_SOCKET_PATH: /run/jarvis-documents/enqueue.sock
      DOCUMENTS_PROCESSING_ENABLED: "${DOCUMENTS_PROCESSING_ENABLED:-false}"
      DOCUMENTS_DOCLING_ENABLED: "${DOCUMENTS_DOCLING_ENABLED:-false}"
      DOCLING_SERVER_VERSION: "${DOCLING_SERVER_VERSION:-1.30.0}"
      DOCLING_IMAGE_DIGEST: "${DOCLING_IMAGE_DIGEST:-sha256:0244089785d5ccb7570dfaa593cdc81ec64a1aadc63ffa9dce065064b0a6a807}"
      DOCUMENTS_PADDLEOCR_ENABLED: "${DOCUMENTS_PADDLEOCR_ENABLED:-false}"
      PADDLEOCR_SERVER_VERSION: "${PADDLEOCR_SERVER_VERSION:-3.7.0}"
      PADDLEOCR_IMAGE_DIGEST: "${PADDLEOCR_IMAGE_DIGEST:-local-build-required}"
      PADDLEOCR_MODEL_TIER: "${PADDLEOCR_MODEL_TIER:-small}"
      PAPERLESS_BASE_URL: http://paperless-webserver:8000
      PAPERLESS_READ_TOKEN_PATH: /run/secrets/paperless_read_token
      JARVIS_OPERATOR_API_KEY: ""
      JARVIS_OPERATOR_API_KEY_FILE: /run/secrets/jarvis_operator_api_key
      DISCORD_ENABLED: "false"
      DISCORD_ATTACHMENT_INGRESS_ENABLED: "false"
      CALENDAR_GOOGLE_ENABLED: "false"
      CALENDAR_INBOX_ENABLED: "false"
      EMAIL_AGENT_ENABLED: "false"
      EMAIL_AGENT_SYNC_ENABLED: "false"
      PLANE_ENABLED: "false"
      WEB_RESEARCH_ENABLED: "false"
      MICRO_MODEL_ENABLED: "false"
      MAIN_REPAIR_MODEL_ENABLED: "false"
      ACTION_TICKET_REVIEW_ENABLED: "false"
    command:
      - python
      - -m
      - uvicorn
      - app.api.document_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --workers
      - "1"
      - --no-access-log
    volumes:
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/jarvis
        target: /opt/jarvis/documents
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/paperless_read_token
        target: /run/secrets/paperless_read_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/jarvis_operator_api_key
        target: /run/secrets/jarvis_operator_api_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/control
        target: /run/jarvis-documents
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [documents-control, documents-edge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8010/documents/ready', timeout=3));
          raise SystemExit(0 if payload.get('status') == 'ready' else 1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

