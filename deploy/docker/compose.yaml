name: jarvis-poc

services:
  ollama:
    image: ollama/ollama@sha256:77f1a2a54460f0380f2611e1464233d9b82cb6e58afc8f60abec0061049d2d82
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null && ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [accelerator-backend]

  accelerator-admission:
    image: jarvis-poc-app:local
    restart: unless-stopped
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      OFFLINE_MODE: "true"
      ACCELERATOR_DATABASE_PATH: /opt/jarvis/data/accelerator/leases.db
      ACCELERATOR_ADMISSION_API_KEY_PATH: /run/secrets/accelerator_admission_api_key
      ACCELERATOR_OLLAMA_MODELS: "${JARVIS_MICRO_MODEL:-qwen2.5:7b},${JARVIS_MAIN_MODEL:-gpt-oss:20b}"
      ACCELERATOR_OLLAMA_EVICTABLE_MODELS: "${JARVIS_MICRO_MODEL:-qwen2.5:7b}"
      ACCELERATOR_OLLAMA_PROTECTED_MODELS: "${JARVIS_MAIN_MODEL:-gpt-oss:20b}"
      ACCELERATOR_MAX_REQUEST_BYTES: "${ACCELERATOR_MAX_REQUEST_BYTES:-2097152}"
      ACCELERATOR_MAX_VLM_REQUEST_BYTES: "${ACCELERATOR_MAX_VLM_REQUEST_BYTES:-75497472}"
      ACCELERATOR_MAX_RESPONSE_BYTES: "${ACCELERATOR_MAX_RESPONSE_BYTES:-16777216}"
      ACCELERATOR_WAIT_SECONDS: "${ACCELERATOR_WAIT_SECONDS:-120}"
      ACCELERATOR_LEASE_SECONDS: "${ACCELERATOR_LEASE_SECONDS:-30}"
      ACCELERATOR_HEARTBEAT_SECONDS: "${ACCELERATOR_HEARTBEAT_SECONDS:-5}"
      ACCELERATOR_UPSTREAM_TIMEOUT_SECONDS: "${ACCELERATOR_UPSTREAM_TIMEOUT_SECONDS:-180}"
      OLLAMA_BACKEND_URL: http://ollama:11434
      DOCUMENTS_PADDLEOCR_VL_ENABLED: "${DOCUMENTS_PADDLEOCR_VL_ENABLED:-false}"
      PADDLEOCR_VL_BACKEND_URL: http://paddleocr-vl-serve:8050
    command:
      - python
      - -m
      - uvicorn
      - app.api.accelerator_admission_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8040"
      - --workers
      - "1"
      - --no-access-log
    volumes:
      - ../../data:/opt/jarvis/data
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/accelerator_admission_api_key
        target: /run/secrets/accelerator_admission_api_key
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [accelerator-control, accelerator-backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,pathlib,urllib.request; key=pathlib.Path('/run/secrets/accelerator_admission_api_key').read_text().strip(); request=urllib.request.Request('http://127.0.0.1:8040/ready',headers={'X-HardyAI-Accelerator-Key':key}); payload=json.load(urllib.request.urlopen(request,timeout=5)); raise SystemExit(0 if payload.get('status') == 'ready' else 1)"
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s

  jarvis:
    image: jarvis-poc-app:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      accelerator-admission:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /opt/jarvis/data/jarvis_v2.db
      MEMORY_MODE: sqlite
      MEMORY_MARKDOWN_PATH: /opt/jarvis/data/memory_markdown
      SKILL_ARTIFACT_AUTO_COMPILE_ENABLED: "false"
      LOCAL_MODEL_URL: http://accelerator-admission:8040
      ACCELERATOR_ADMISSION_REQUIRED: "true"
      ACCELERATOR_ADMISSION_API_KEY_PATH: /run/secrets/accelerator_admission_api_key
      MICRO_MODEL_ENABLED: "${JARVIS_MODELS_ENABLED:-false}"
      MICRO_MODEL_PROVIDER: ollama
      MICRO_MODEL_NAME: "${JARVIS_MICRO_MODEL:-qwen2.5:7b}"
      MICRO_MODEL_TIMEOUT_SECONDS: "30"
      MICRO_MODEL_NUM_CTX: "${MICRO_MODEL_NUM_CTX:-4096}"
      MICRO_MODEL_NUM_PREDICT: "${MICRO_MODEL_NUM_PREDICT:-256}"
      MICRO_MODEL_HEURISTIC_FALLBACK_ENABLED: "true"
      MAIN_REPAIR_MODEL_ENABLED: "${JARVIS_MODELS_ENABLED:-false}"
      MAIN_REPAIR_MODEL_PROVIDER: ollama
      MAIN_REPAIR_MODEL_NAME: "${JARVIS_MAIN_MODEL:-gpt-oss:20b}"
      MAIN_REPAIR_MODEL_TIMEOUT_SECONDS: "60"
      MAIN_REPAIR_MODEL_NUM_CTX: "${MAIN_REPAIR_MODEL_NUM_CTX:-32768}"
      MAIN_REPAIR_MODEL_NUM_PREDICT: "${MAIN_REPAIR_MODEL_NUM_PREDICT:-512}"
      MAIN_CONVERSATION_MODEL_TIMEOUT_SECONDS: "90"
      MAIN_CONVERSATION_MODEL_NUM_CTX: "${MAIN_CONVERSATION_MODEL_NUM_CTX:-32768}"
      MAIN_CONVERSATION_MODEL_NUM_PREDICT: "${MAIN_CONVERSATION_MODEL_NUM_PREDICT:-1024}"
      MAIN_AGENT_LOOP_CONTEXT_MAX_CHARS: "${MAIN_AGENT_LOOP_CONTEXT_MAX_CHARS:-6000}"
      WEB_RESEARCH_ENABLED: "${WEB_RESEARCH_ENABLED:-false}"
      WEB_RESEARCH_PROVIDER: searxng
      WEB_RESEARCH_BASE_URL: http://searxng:8080
      WEB_RESEARCH_DECISION_MODEL_NUM_CTX: "${WEB_RESEARCH_DECISION_MODEL_NUM_CTX:-32768}"
      WEB_RESEARCH_DECISION_MODEL_NUM_PREDICT: "${WEB_RESEARCH_DECISION_MODEL_NUM_PREDICT:-256}"
      CALENDAR_GOOGLE_ENABLED: "${CALENDAR_GOOGLE_ENABLED:-false}"
      GOOGLE_PERMISSIONS_PATH: /opt/jarvis/secrets/live/google_permissions.yaml
      CALENDAR_INBOX_ENABLED: "${CALENDAR_INBOX_ENABLED:-false}"
      CALENDAR_INBOX_TIMEZONE: "${CALENDAR_INBOX_TIMEZONE:-America/New_York}"
      CALENDAR_INBOX_START_HOUR: "${CALENDAR_INBOX_START_HOUR:-8}"
      CALENDAR_INBOX_END_HOUR: "${CALENDAR_INBOX_END_HOUR:-20}"
      CALENDAR_INBOX_POLL_SECONDS: "${CALENDAR_INBOX_POLL_SECONDS:-60}"
      CALENDAR_INBOX_MAX_MESSAGES_PER_RUN: "${CALENDAR_INBOX_MAX_MESSAGES_PER_RUN:-100}"
      CALENDAR_INBOX_LOOKBACK_DAYS: "${CALENDAR_INBOX_LOOKBACK_DAYS:-30}"
      CALENDAR_INBOX_ALLOWED_SENDER_EMAILS: "${CALENDAR_INBOX_ALLOWED_SENDER_EMAILS:-}"
      EMAIL_AGENT_ENABLED: "${EMAIL_AGENT_ENABLED:-false}"
      EMAIL_AGENT_SYNC_ENABLED: "${EMAIL_AGENT_SYNC_ENABLED:-false}"
      EMAIL_AGENT_PERMISSIONS_PATH: /opt/jarvis/secrets/live/email_agent_permissions.yaml
      EMAIL_AGENT_TIMEZONE: "${EMAIL_AGENT_TIMEZONE:-America/New_York}"
      EMAIL_AGENT_SCHEDULER_POLL_SECONDS: "${EMAIL_AGENT_SCHEDULER_POLL_SECONDS:-60}"
      EMAIL_AGENT_SYNC_INTERVAL_SECONDS: "${EMAIL_AGENT_SYNC_INTERVAL_SECONDS:-600}"
      EMAIL_AGENT_ON_DEMAND_STALE_SECONDS: "${EMAIL_AGENT_ON_DEMAND_STALE_SECONDS:-120}"
      EMAIL_AGENT_MAX_HISTORY_PAGES: "${EMAIL_AGENT_MAX_HISTORY_PAGES:-5}"
      EMAIL_AGENT_MAX_MESSAGES_PER_RUN: "${EMAIL_AGENT_MAX_MESSAGES_PER_RUN:-100}"
      EMAIL_AGENT_MAX_INTERACTIVE_MESSAGES: "${EMAIL_AGENT_MAX_INTERACTIVE_MESSAGES:-10}"
      EMAIL_AGENT_MAX_BODY_BYTES: "${EMAIL_AGENT_MAX_BODY_BYTES:-1048576}"
      EMAIL_AGENT_REFERENCE_RETENTION_HOURS: "${EMAIL_AGENT_REFERENCE_RETENTION_HOURS:-72}"
      EMAIL_AGENT_ALLOW_HISTORICAL_BACKFILL: "${EMAIL_AGENT_ALLOW_HISTORICAL_BACKFILL:-false}"
      EMAIL_AGENT_SUMMARY_MODEL_PROVIDER: "${EMAIL_AGENT_SUMMARY_MODEL_PROVIDER:-ollama}"
      EMAIL_AGENT_MODEL_NUM_CTX: "${EMAIL_AGENT_MODEL_NUM_CTX:-32768}"
      EMAIL_AGENT_SUMMARY_NUM_PREDICT: "${EMAIL_AGENT_SUMMARY_NUM_PREDICT:-1024}"
      EMAIL_AGENT_CLASSIFIER_NUM_PREDICT: "${EMAIL_AGENT_CLASSIFIER_NUM_PREDICT:-256}"
      EMAIL_AGENT_ALLOW_REMOTE_MODEL: "${EMAIL_AGENT_ALLOW_REMOTE_MODEL:-false}"
      EMAIL_AGENT_ATTACHMENT_EXTRACTION_ENABLED: "false"
      EMAIL_AGENT_LABEL_SHADOW_ENABLED: "true"
      EMAIL_AGENT_LABEL_WRITES_ENABLED: "${EMAIL_AGENT_LABEL_WRITES_ENABLED:-false}"
      # The API sees the configured path but does not mount or load the Modify token.
      EMAIL_AGENT_LABEL_TOKEN_PATH: /opt/jarvis/secrets/email-spam-worker/token.json
      EMAIL_AGENT_SPAM_WRITES_ENABLED: "${EMAIL_AGENT_SPAM_WRITES_ENABLED:-false}"
      EMAIL_AGENT_WORKER_TOKEN_ISOLATED: "true"
      # The path is visible to the API for configuration only. The token itself is not mounted here.
      EMAIL_AGENT_SPAM_TOKEN_PATH: /opt/jarvis/secrets/email-spam-worker/token.json
      DISCORD_ENABLED: "${JARVIS_DISCORD_ENABLED:-false}"
      DISCORD_PERMISSIONS_PATH: /opt/jarvis/secrets/live/discord_permissions.yaml
      DISCORD_ATTACHMENT_INGRESS_ENABLED: "${DISCORD_ATTACHMENT_INGRESS_ENABLED:-false}"
      DISCORD_ATTACHMENT_INGRESS_BASE_URL: http://discord-attachment-ingress:8020
      DISCORD_ATTACHMENT_INGRESS_TIMEOUT_SECONDS: "${DISCORD_ATTACHMENT_INGRESS_TIMEOUT_SECONDS:-180}"
      DISCORD_ATTACHMENT_MAX_PER_MESSAGE: "${DISCORD_ATTACHMENT_MAX_PER_MESSAGE:-4}"
      DISCORD_DOCUMENT_NOTIFICATIONS_ENABLED: "${DISCORD_DOCUMENT_NOTIFICATIONS_ENABLED:-false}"
      DISCORD_DOCUMENT_NOTIFICATION_POLL_SECONDS: "${DISCORD_DOCUMENT_NOTIFICATION_POLL_SECONDS:-2}"
      DOCUMENTS_ENABLED: "${DOCUMENTS_ENABLED:-false}"
      DOCUMENTS_LOCAL_ONLY: "true"
      DOCUMENT_GATEWAY_BASE_URL: http://document-gateway:8010
      DOCUMENT_GATEWAY_OPERATOR_KEY_PATH: /run/secrets/jarvis_operator_api_key
    ports:
      - "${JARVIS_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    networks: [default, accelerator-control, documents-control, discord-ingress-control]
    volumes:
      - ../../.env:/opt/jarvis/.env:ro
      - ../../data:/opt/jarvis/data
      - ../../secrets/live:/opt/jarvis/secrets/live:ro
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/jarvis_operator_api_key
        target: /run/secrets/jarvis_operator_api_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/accelerator_admission_api_key
        target: /run/secrets/accelerator_admission_api_key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3));
          raise SystemExit(0 if payload.get('status') == 'ok' else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  searxng:
    image: searxng/searxng@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
    profiles: ["research"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: "${SEARXNG_SECRET_KEY:-replace-before-nonlocal-use}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ticket-review:
    image: jarvis-poc-app:local
    profiles: ["tickets"]
    restart: unless-stopped
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      accelerator-admission:
        condition: service_healthy
      jarvis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /opt/jarvis/data/jarvis_v2.db
      SKILL_ARTIFACT_AUTO_COMPILE_ENABLED: "false"
      LOCAL_MODEL_URL: http://accelerator-admission:8040
      ACCELERATOR_ADMISSION_REQUIRED: "true"
      ACCELERATOR_ADMISSION_API_KEY_PATH: /run/secrets/accelerator_admission_api_key
      ACTION_TICKET_REVIEW_ENABLED: "true"
    command: ["python", "-m", "app.workers.ticket_review_worker"]
    volumes:
      - ../../data:/opt/jarvis/data
      - ../../secrets/live:/opt/jarvis/secrets/live:ro
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/accelerator_admission_api_key
        target: /run/secrets/accelerator_admission_api_key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, accelerator-control]

  plane-sync:
    image: jarvis-poc-app:local
    profiles: ["plane"]
    restart: unless-stopped
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      jarvis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /opt/jarvis/data/jarvis_v2.db
      SKILL_ARTIFACT_AUTO_COMPILE_ENABLED: "false"
      PLANE_ENABLED: "true"
    command: ["python", "-m", "app.workers.plane_sync_worker"]
    volumes:
      - ../../data:/opt/jarvis/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  email-spam-worker:
    image: jarvis-poc-app:local
    profiles: ["email-spam"]
    restart: "no"
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      DATABASE_PATH: /opt/jarvis/data/jarvis_v2.db
      SKILL_ARTIFACT_AUTO_COMPILE_ENABLED: "false"
      EMAIL_AGENT_ENABLED: "true"
      EMAIL_AGENT_SPAM_WRITES_ENABLED: "true"
      EMAIL_AGENT_WORKER_TOKEN_ISOLATED: "false"
      EMAIL_AGENT_LABEL_WRITES_ENABLED: "${EMAIL_AGENT_LABEL_WRITES_ENABLED:-false}"
      EMAIL_AGENT_PERMISSIONS_PATH: /opt/jarvis/secrets/live/email_agent_permissions.yaml
      EMAIL_AGENT_SPAM_TOKEN_PATH: /opt/jarvis/secrets/email-spam-worker/token.json
      EMAIL_AGENT_LABEL_TOKEN_PATH: /opt/jarvis/secrets/email-spam-worker/token.json
    command: ["python", "scripts/run_email_spam_worker.py"]
    volumes:
      - ../../data:/opt/jarvis/data
      - ../../secrets/live/email_agent_permissions.yaml:/opt/jarvis/secrets/live/email_agent_permissions.yaml:ro
      - ../../secrets/email-spam-worker/token.json:/opt/jarvis/secrets/email-spam-worker/token.json
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  paperless-broker:
    image: valkey/valkey@sha256:f0ba225266310efba5fb33383e21c64fbd07907304224786c780606e7ebd7327
    profiles: ["documents"]
    restart: unless-stopped
    user: "${PAPERLESS_VALKEY_UID:-999}:${JARVIS_GID:-1001}"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/paperless/valkey
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [paperless-data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  paperless-db:
    image: postgres@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    profiles: ["documents"]
    restart: unless-stopped
    user: "${PAPERLESS_POSTGRES_UID:-999}:${JARVIS_GID:-1001}"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_db_password
    volumes:
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/paperless/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/paperless_db_password
        target: /run/secrets/paperless_db_password
        read_only: true
        bind:
          create_host_path: false
    shm_size: 256mb
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [paperless-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
    profiles: ["documents"]
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 512
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_db_password
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_TIME_ZONE: "${DOCUMENTS_TIME_ZONE:-America/New_York}"
      PAPERLESS_OCR_LANGUAGE: "${PAPERLESS_OCR_LANGUAGE:-eng}"
      PAPERLESS_OCR_MODE: auto
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
      PAPERLESS_URL: http://paperless-webserver:8000
    volumes:
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/paperless/data
        target: /usr/src/paperless/data
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/paperless/media
        target: /usr/src/paperless/media
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_STORAGE_ROOT:-/mnt/hardyai-documents-required}/paperless/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/paperless_db_password
        target: /run/secrets/paperless_db_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/paperless_secret_key
        target: /run/secrets/paperless_secret_key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
      - /run:exec,mode=0755,uid=${JARVIS_UID:-1001},gid=${JARVIS_GID:-1001}
      - /usr/src/paperless/consume:mode=0700,uid=${JARVIS_UID:-1001},gid=${JARVIS_GID:-1001}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [documents-edge, paperless-data]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read(1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  document-worker:
    image: jarvis-poc-app:local
    profiles: ["documents"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    user: "${JARVIS_UID:-1001}:${JARVIS_GID:-1001}"
    depends_on:
      paperless-webserver:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      OFFLINE_MODE: "true"
      DOCUMENTS_ENABLED: "true"
      DOCUMENTS_LOCAL_ONLY: "true"
      DATABASE_PATH: /opt/jarvis/data/jarvis_v2.db
      DOCUMENTS_DATABASE_PATH: /opt/jarvis/documents/documents.db
      DOCUMENTS_SPOOL_PATH: /opt/jarvis/documents/spool
      DOCUMENTS_ARTIFACTS_PATH: /opt/jarvis/documents/artifacts
      DOCUMENTS_MIN_FREE_BYTES: "${DOCUMENTS_MIN_FREE_BYTES:-1073741824}"
      DOCUMENTS_MAX_IMAGE_PIXELS: "${DOCUMENTS_MAX_IMAGE_PIXELS:-64000000}"
      DOCUMENT_JOB_SOCKET_PATH: /run/jarvis-documents/enqueue.sock
      DOCUMENTS_PROCESSING_ENABLED: "${DOCUMENTS_PROCESSING_ENABLED:-false}"
