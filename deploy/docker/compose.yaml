        source: ${DOCUMENTS_SECRETS_ROOT:-/etc/hardyai/documents-required}/accelerator_admission_api_key
        target: /run/secrets/accelerator_admission_api_key
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp:exec,mode=0700,uid=${JARVIS_UID:-1001},gid=${JARVIS_GID:-1001},size=2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [accelerator-backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nvidia-smi -L >/dev/null && python -c "import json,pathlib,urllib.request; key=pathlib.Path('/run/secrets/accelerator_admission_api_key').read_text().strip(); request=urllib.request.Request('http://127.0.0.1:8050/ready',headers={'X-HardyAI-Accelerator-Key':key}); payload=json.load(urllib.request.urlopen(request,timeout=5)); raise SystemExit(0 if payload.get('status') == 'ready' and payload.get('models_local') else 1)"
      interval: 15s
      timeout: 8s
      retries: 24
      start_period: 60s

