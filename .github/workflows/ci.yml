name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.txt --strict

      - name: Reject secrets and private artifacts
        run: python scripts/check_public_tree.py --root .

      - name: Check fatal Python errors
        run: python -m ruff check app scripts tests --select E9,F63,F7,F82

      - name: Compile Python
        run: python -m compileall -q app scripts tests

      - name: Run tests
        env:
          APP_ENV: test
          JARVIS_SKIP_DOTENV: "true"
        run: python -m pytest -q

      - name: Prove clean export
        run: python scripts/export_clean_repo.py ../jarvis-clean-smoke
